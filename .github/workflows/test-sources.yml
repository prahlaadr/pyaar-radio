name: Test sources framework

on:
  push:
    paths: ['sources/**', 'public/data/channels.json', '.github/workflows/test-sources.yml']
  pull_request:
    paths: ['sources/**', 'public/data/channels.json']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install ytmusicapi
      - name: Run framework + channels tests
        run: python sources/test_sources.py
