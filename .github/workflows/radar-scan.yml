name: Radar Monthly Scan

on:
  schedule:
    - cron: '0 14 1 * *'    # 1st of every month at 9 AM EST (UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write browser auth
        run: echo '${{ secrets.YTMUSIC_BROWSER_AUTH }}' > browser.json

      - name: Seed radar state
        run: python -m radar seed

      - name: Scan for new releases
        run: python -m radar release

      - name: Reconcile against saved library
        # Drop alerts for albums already liked in YT Music (uses the committed
        # albums/_index.json, refreshed daily by sync-masterlist.yml).
        run: python -m radar reconcile

      - name: Verify new alerts (Deezer)
        # Tag each remaining alert verified / unconfirmed / noise (soundtracks,
        # deluxe, comps). No API key needed; badges render on the deployed /radar.
        run: python -m radar verify --all

      - name: Check for new alerts
        id: changes
        run: |
          git add public/data/radar-alerts.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "radar: monthly scan ($(date +%Y-%m-%d))"
          for i in $(seq 1 5); do
            git pull --rebase --autostash origin main && git push && break
            if [ "$i" = 5 ]; then echo "::error::push failed after 5 retries"; exit 1; fi
            echo "remote moved, retrying ($i)..."; sleep 5
          done

      - name: Open triage-ready issue
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json, os, subprocess, datetime
          from collections import Counter
          alerts = json.load(open("public/data/radar-alerts.json"))["alerts"]
          new_alerts = [a for a in alerts if a.get("status") == "new"]
          if not new_alerts:
              print("No 'new' alerts to triage.")
              raise SystemExit(0)
          today = datetime.date.today().strftime("%Y-%m")
          title = f"Radar Triage Ready: {len(new_alerts)} new albums ({today})"
          vc = Counter(a.get("verify", "") or "unchecked" for a in new_alerts)
          badge = {"verified": "✅", "unconfirmed": "◽", "noise": "⚠️"}
          def line(a):
              return f"- [ ] {badge.get(a.get('verify',''),'')} **{a['artist']}** — {a['title']} ({a.get('year','')})"
          noise = [a for a in new_alerts if a.get("verify") == "noise"]
          keep = [a for a in new_alerts if a.get("verify") != "noise"]
          rows = "\n".join(line(a) for a in keep)
          skip_rows = "\n".join(line(a) for a in noise) or "_none_"
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          body = f"""\
          The monthly radar scan found **{len(new_alerts)} new albums** — already verified against Deezer and de-duped against your YT Music library (albums you'd already liked were removed).

          **{vc.get('verified',0)} ✅ verified · {vc.get('unconfirmed',0)} ◽ unconfirmed · {vc.get('noise',0)} ⚠️ suggested-skip**

          ## How to triage

          1. Review at https://radio.pyaarproject.org/radar/audit (grouped by verdict, ▶ listen on each row) or https://radio.pyaarproject.org/radar (the queue).
          2. Export your picks JSON, commit it to `triage-runs/<date>.json`, then apply in the cloud:

             ```
             gh workflow run triage-apply.yml --repo {repo} \\
               -f triage_path=triage-runs/<date>.json -f mode=apply -f run_sync=true
             ```

          ## To review

          {rows}

          ## Suggested skips (soundtracks / deluxe / live / comps)

          {skip_rows}

          *(Auto-opened by `radar-scan.yml` after the {today} scan committed `public/data/radar-alerts.json`.)*
          """
          # dedent
          body = "\n".join(ln.lstrip() if ln.startswith("          ") else ln for ln in body.splitlines())
          subprocess.run(
              ["gh", "issue", "create", "--title", title, "--body", body, "--label", "triage"],
              check=True,
          )
          PY

      - name: Cleanup
        if: always()
        run: rm -f browser.json
